name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shllcd/actions/setup-rust@v1
        with:
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace -- -D warnings
      - name: Generated files
        run: cargo xtask codegen --check
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Typecheck
        working-directory: packages/orisu
        run: |
          npm install --ignore-scripts
          npm run typecheck

  # Prepare, the 8-target build, npm publish and the release commit in one call.
  release:
    needs: verify
    permissions:
      contents: write
      id-token: write
    uses: shllcd/actions/.github/workflows/napi-release.yml@v1
    with:
      crate: orisu_napi
      package-dir: packages/orisu
      napi-name: orisu
      binding-name: '@orisu/binding-{platform}'
      zig-version: 0.15.2
      build-command: npm install --ignore-scripts && npm run build
      version-files: |
        packages/orisu/src/cli.ts:const VERSION = "([^"]*)";
