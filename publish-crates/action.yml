name: Publish crates
description: Publish Rust crates to crates.io.

inputs:
  packages:
    description: Comma-separated crates in publish order
    required: true
  version:
    description: Version being published, for the already-published check
    required: true
  token:
    description: crates.io token. Omit to authenticate with OIDC (no secret)
    default: ''
  path:
    description: Workspace root
    default: '.'
  args:
    description: Extra cargo publish arguments
    default: --locked
  retries:
    description: Attempts per crate while the index propagates
    default: '10'
  sleep:
    description: Seconds between attempts
    default: '20'
runs:
  using: composite
  steps:
    - name: Authenticate
      id: auth
      if: inputs.token == ''
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

    - name: Publish
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ inputs.token || steps.auth.outputs.token }}
        PACKAGES: ${{ inputs.packages }}
        VERSION: ${{ inputs.version }}
        ARGS: ${{ inputs.args }}
        RETRIES: ${{ inputs.retries }}
        SLEEP: ${{ inputs.sleep }}
      run: |
        set -euo pipefail
        for crate in ${PACKAGES//,/ }; do
          if curl -sf "https://crates.io/api/v1/crates/$crate/$VERSION" > /dev/null; then
            echo "$crate $VERSION is already published, skipping"
            continue
          fi

          attempt=1
          while true; do
            if out=$(cargo publish -p "$crate" $ARGS 2>&1); then
              printf '%s\n' "$out"
              break
            fi
            printf '%s\n' "$out"
            # Only an index that has not caught up yet is worth waiting for;
            # a bad token or a broken manifest fails the same way every time.
            if ! grep -qiE 'no matching package|failed to select a version|429|50[234]' <<< "$out"; then
              echo "::error::publishing $crate failed, not an index delay"
              exit 1
            fi
            if [ "$attempt" -ge "$RETRIES" ]; then
              echo "::error::publishing $crate failed after $RETRIES attempts"
              exit 1
            fi
            echo "$crate: attempt $attempt failed, retrying in ${SLEEP}s"
            attempt=$((attempt + 1))
            sleep "$SLEEP"
          done
        done
